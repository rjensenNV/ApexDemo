name: Report a bug
description: Report reproducible Apex behavior that appears to be incorrect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Apex.

        Do not disclose security vulnerabilities here. Follow `SECURITY.md` to report them privately.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Identify the affected Apex tag, container version, or commit.
      placeholder: "For example: 25.09 or a1d527a"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the relevant OS, Python, PyTorch, compiler, GPU, driver, CUDA, container, and dependency versions. Run `python -m torch.utils.collect_env` when available. Redact secrets and private data.
      placeholder: |
        OS and architecture:
        Python and PyTorch:
        GPU, driver, and CUDA:
        Installation method and build options:
        Container, compiler, and other relevant dependencies:
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal steps or code to reproduce
      description: Provide the smallest code, configuration, or data that reproduces the problem, any required setup, and the exact commands to run. Remove unrelated details. See [Minimal, Reproducible Example](https://stackoverflow.com/help/minimal-reproducible-example) for additional guidance.
      placeholder: |
        Minimal code, configuration, or data:
        Required setup:
        Exact commands:
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Explain what happened instead. Include relevant logs or screenshots after removing sensitive information.
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add regression details, workarounds, related issues, or anything else that helps diagnose the problem.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets, credentials, private links, and sensitive data from this report.
          required: true
